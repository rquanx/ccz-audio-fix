name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build
        shell: cmd
        run: scripts\build-ci.bat
      - name: Test
        shell: cmd
        run: scripts\test-ci.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Ekd5-audio-fix
          path: release/Ekd5-audio-fix.exe
